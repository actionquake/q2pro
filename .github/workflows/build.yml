name: build

on:
  push:
    branches: [master, aqtion, aqtion-alpha, ci]
  pull_request:
    branches: [master, aqtion, aqtion-alpha]
  workflow_dispatch:

env:
  MESON_ARGS: >-
    --auto-features=enabled
    --fatal-meson-warnings
    -Danticheat-server=true
    -Davcodec=disabled
    -Dclient-gtv=true
    -Dpacketdup-hack=true
    -Dtests=false
    -Dvariable-fps=true
    -Dwerror=false
    -Daqtion-build=true
    -Ddiscord-sdk=false

  MESON_ARGS_WIN: >-
    -Dsdl2=disabled
    -Dx11=disabled
    -Dwayland=disabled
    -Dwindows-egl=true
    -Dwrap_mode=forcefallback

  MESON_ARGS_LINUX: >-
    -Dx11=enabled
    -Dwayland=enabled
    -Dsdl2=enabled
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback

  MESON_ARGS_MAC: >-
    -Dwindows-crash-dumps=disabled
    -Dwrap_mode=nofallback
    -Dwayland=disabled
    -Dx11=disabled
    -Dicmp-errors=disabled

jobs:
  mingw:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        #arch: ["i686", "x86_64"]
        arch: ["x86_64"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 nasm python3-pip ninja-build
          sudo python3 -m pip install meson

      - name: Build
        run: |
          meson setup --cross-file=.ci/${{ matrix.arch }}-w64-mingw32.txt \
          ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} builddir
          meson compile -vC builddir

      - name: Generate Win Mingw archives
        uses: actions/upload-artifact@v6
        with:
          name: q2pro-mingw-${{ matrix.arch }}
          path: |
            builddir/q2pro.exe
            builddir/q2proded.exe
            builddir/gamex86_64.dll

  msvc:
    runs-on: windows-latest
    strategy:
      matrix:
        #arch: ["x86", "x64"]
        arch: ["x64"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - uses: ilammy/setup-nasm@v1

      - name: Install dependencies
        run: pip3 install --no-input meson ninja

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_WIN }} builddir
          meson compile -C builddir

      - name: Generate Win MSVC archives
        uses: actions/upload-artifact@v6
        with:
          name: q2pro-msvc-${{ matrix.arch }}
          path: |
            builddir/q2pro.exe
            builddir/q2proded.exe
            builddir/gamex86_64.dll

  linux64:
    runs-on: ubuntu-22.04
    #runs-on: [self-hosted, x86]
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libsdl2-dev libopenal-dev \
          libpng-dev libjpeg-dev zlib1g-dev mesa-common-dev \
          libcurl4-openssl-dev libx11-dev libxi-dev \
          libwayland-dev wayland-protocols libdecor-0-dev \
          libavcodec-dev libavformat-dev libavutil-dev \
          libswresample-dev libswscale-dev \
          uuid-dev patchelf

      - name: Install libjansson libs from source
        run: |
          wget https://github.com/akheron/jansson/releases/download/v2.14/jansson-2.14.tar.gz
          tar xfz jansson-2.14.tar.gz && cd jansson-2.14
          CFLAGS="-fPIC" ./configure
          make && sudo make install

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_LINUX }} builddir
          meson compile -C builddir
        env:
          CC: ${{ matrix.cc }}

      - name: patchelf path to discord_game_sdk.so
        run: |
          patchelf --replace-needed /home/runner/work/q2pro/q2pro/extern/discord/lib/x86_64/discord_game_sdk.so ./discord_game_sdk.so builddir/q2pro

      - name: Set binaries as executable
        run: |
          chmod +x builddir/q2pro*
          
      - name: Generate Linux x64 archives
        uses: actions/upload-artifact@v6
        with:
          name: q2pro-lin-${{ matrix.cc }}-x86_64
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/gamex86_64.so

  linuxARM64:
    runs-on: [self-hosted, ARM64]
    strategy:
      matrix:
        cc: [gcc]
    steps:
      - uses: actions/checkout@v6

      # - name: Install dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y meson libsdl2-dev libopenal-dev \
      #     libpng-dev libjpeg-dev zlib1g-dev mesa-common-dev \
      #     libcurl4-gnutls-dev libx11-dev libxi-dev \
      #     libwayland-dev wayland-protocols libdecor-0-dev patchelf \
      #     libogg-dev libvorbis-dev

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_LINUX }} builddir
          meson compile -vC builddir
        env:
          CC: ${{ matrix.cc }}

      - name: Set binaries as executable
        run: |
          chmod +x builddir/q2pro*

      - name: Generate Linux ARM archives
        uses: actions/upload-artifact@v6
        with:
          name: q2pro-lin-arm64
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/gamearm64.so

  fedora:
    runs-on: [self-hosted, linux, fedora]
    steps:
      - uses: actions/checkout@v6

      # Already installed, run this manually to update/patch versions
      # - name: Install dependencies
      #   run: |
      #     sudo dnf install -y meson ninja-build gcc \
      #     SDL2-devel openal-soft-devel \
      #     libpng-devel libjpeg-turbo-devel zlib-devel mesa-libGL-devel \
      #     libcurl-devel libX11-devel libXi-devel \
      #     wayland-devel wayland-protocols-devel libdecor-devel \
      #     libuuid-devel patchelf jansson-devel

      # jansson needed built from source, uuid needed dnf install mingw64-crt-13.0.0-2.fc43.noarch and ln -s the libuuid.a to /usr/lib64
      - name: Build
        run: |
          meson setup --wipe --force-fallback-for=jansson,uuid ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_LINUX }} builddir
          meson compile -C builddir

      - name: Set binaries as executable
        run: |
          chmod +x builddir/q2pro*

      - name: Generate Linux Fedora archives
        uses: actions/upload-artifact@v6
        with:
          name: q2pro-fedora-x86_64
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/gamex86_64.so

  darwin:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install pkg-config meson libpng sdl2 \
          openal-soft zlib curl ffmpeg jpeg-turbo \
          ossp-uuid jansson

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_MAC }} builddir
          meson compile -vC builddir
        env:
          CC: "gcc"
          PKG_CONFIG_PATH: "/usr/local/opt/openal-soft/lib/pkgconfig"
          CFLAGS: "-mmacosx-version-min=10.7"

      - name: Set binaries as executable
        run: |
          chmod +x builddir/q2pro*

      - name: Generate Mac archives
        uses: actions/upload-artifact@v6
        with:
          name: q2pro-darwin-x86_64
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/gamex86_64.dylib

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install pkg-config meson libpng sdl2 openal-soft zlib curl ffmpeg jpeg-turbo jansson ossp-uuid

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_MAC }} builddir
          meson compile -vC builddir
        env:
          CC: "gcc"
          PKG_CONFIG_PATH: "/opt/homebrew/opt/openal-soft/lib/pkgconfig"
          CFLAGS: "-target arm64-apple-macos11"

      - name: Set binaries as executable
        run: |
          chmod +x builddir/q2pro*

      - name: Generate Mac archives
        uses: actions/upload-artifact@v6
        with:
          name: q2pro-darwin-arm64
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/gamearm64.dylib

  # ----------------------------------------------------------------------
  # Turnkey ("no-install") builds for end users — additive, do not replace
  # the existing builds above.
  # ----------------------------------------------------------------------

  # Self-contained AQtion.app for ARM64 Macs.
  # All Homebrew dylib dependencies are bundled into Contents/Frameworks/
  # via dylibbundler and the binary's link paths are rewritten to
  # @executable_path/../Frameworks/ — player needs zero brew installs.
  # Game data (baseaq/, action/) is expected ALONGSIDE the .app, not inside.
  darwin-arm64-turnkey:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install build + bundling dependencies
        run: |
          brew install pkg-config meson libpng sdl2 openal-soft zlib curl ffmpeg jpeg-turbo jansson ossp-uuid dylibbundler

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_MAC }} builddir
          meson compile -vC builddir
        env:
          CC: "gcc"
          PKG_CONFIG_PATH: "/opt/homebrew/opt/openal-soft/lib/pkgconfig"
          CFLAGS: "-target arm64-apple-macos11"

      - name: Assemble AQtion.app bundle
        run: |
          APP=AQtion.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources"

          cp builddir/q2pro          "$APP/Contents/MacOS/"
          cp builddir/q2proded       "$APP/Contents/MacOS/"
          cp builddir/gamearm64.dylib "$APP/Contents/MacOS/"

          cp .ci/mac/Info.plist               "$APP/Contents/Info.plist"
          install -m 0755 .ci/mac/AQtion-launcher "$APP/Contents/MacOS/AQtion-launcher"

          # Icon: drop if present; otherwise the bundle ships without one
          # (Finder falls back to a generic icon — does not break launch).
          if [ -f .ci/mac/AQtion.icns ]; then
            cp .ci/mac/AQtion.icns "$APP/Contents/Resources/"
          fi

      - name: Bundle all dylib dependencies into the .app
        run: |
          APP=AQtion.app
          # Walk every linked dylib for the main binary, the dedicated server,
          # and the game library; copy them into Frameworks/ and rewrite
          # the binaries' install_name references.
          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/q2pro" \
            -x "$APP/Contents/MacOS/q2proded" \
            -x "$APP/Contents/MacOS/gamearm64.dylib" \
            -d "$APP/Contents/Frameworks/" \
            -p "@executable_path/../Frameworks/"

      - name: Verify .app has no external dylib references
        run: |
          APP=AQtion.app
          echo "=== q2pro linkage ==="
          otool -L "$APP/Contents/MacOS/q2pro"
          echo
          echo "=== Any reference to /usr/local, /opt, or absolute brew paths? ==="
          if otool -L "$APP/Contents/MacOS/q2pro" "$APP/Contents/MacOS/q2proded" "$APP/Contents/MacOS/gamearm64.dylib" \
              | grep -E "/usr/local/|/opt/homebrew|/opt/local" ; then
            echo "ERROR: external dependency leaked into bundle"
            exit 1
          fi
          echo "OK — bundle is self-contained"

      - name: Ad-hoc codesign the .app
        run: |
          # Self-signed with no developer cert. Does NOT bypass Gatekeeper
          # (user still right-click → Open on first launch when downloaded
          # via browser), but produces a stable, valid signature so some
          # macOS subsystems and third-party tools stop complaining about
          # an unsigned binary. Free, no Apple Developer account required.
          codesign --force --deep --sign - AQtion.app
          codesign --verify --verbose AQtion.app

      - name: Diagnostic — confirm exec bits + bundle layout before upload
        run: |
          echo "=== Bundle tree ==="
          ls -laR AQtion.app | head -60
          echo
          echo "=== Launcher exec bit ==="
          ls -la AQtion.app/Contents/MacOS/AQtion-launcher
          file AQtion.app/Contents/MacOS/AQtion-launcher

      # Upload the .app directly so actions/upload-artifact zips ONCE.
      # User downloads AQtion-darwin-arm64.zip, extracts → AQtion.app.
      # No double zip, no manual archiving needed.
      - uses: actions/upload-artifact@v6
        with:
          name: AQtion-darwin-arm64
          path: AQtion.app

  # Same as above for Intel Macs. Kept as a separate job so each artifact
  # is independently testable. (A future "lipo into universal" job can
  # combine the two .app bundles.)
  darwin-x86_64-turnkey:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Install build + bundling dependencies
        run: |
          brew install pkg-config meson libpng sdl2 openal-soft zlib curl ffmpeg jpeg-turbo ossp-uuid jansson dylibbundler

      - name: Build
        run: |
          meson setup ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_MAC }} builddir
          meson compile -vC builddir
        env:
          CC: "gcc"
          PKG_CONFIG_PATH: "/usr/local/opt/openal-soft/lib/pkgconfig"
          CFLAGS: "-mmacosx-version-min=10.7"

      - name: Assemble AQtion.app bundle
        run: |
          APP=AQtion.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/Resources"

          cp builddir/q2pro            "$APP/Contents/MacOS/"
          cp builddir/q2proded         "$APP/Contents/MacOS/"
          cp builddir/gamex86_64.dylib "$APP/Contents/MacOS/"

          cp .ci/mac/Info.plist               "$APP/Contents/Info.plist"
          install -m 0755 .ci/mac/AQtion-launcher "$APP/Contents/MacOS/AQtion-launcher"

          if [ -f .ci/mac/AQtion.icns ]; then
            cp .ci/mac/AQtion.icns "$APP/Contents/Resources/"
          fi

      - name: Bundle all dylib dependencies into the .app
        run: |
          APP=AQtion.app
          dylibbundler -od -b \
            -x "$APP/Contents/MacOS/q2pro" \
            -x "$APP/Contents/MacOS/q2proded" \
            -x "$APP/Contents/MacOS/gamex86_64.dylib" \
            -d "$APP/Contents/Frameworks/" \
            -p "@executable_path/../Frameworks/"

      - name: Verify .app has no external dylib references
        run: |
          APP=AQtion.app
          echo "=== q2pro linkage ==="
          otool -L "$APP/Contents/MacOS/q2pro"
          echo
          echo "=== Any reference to /usr/local, /opt, or absolute brew paths? ==="
          if otool -L "$APP/Contents/MacOS/q2pro" "$APP/Contents/MacOS/q2proded" "$APP/Contents/MacOS/gamex86_64.dylib" \
              | grep -E "/usr/local/|/opt/homebrew|/opt/local" ; then
            echo "ERROR: external dependency leaked into bundle"
            exit 1
          fi
          echo "OK — bundle is self-contained"

      - name: Ad-hoc codesign the .app
        run: |
          codesign --force --deep --sign - AQtion.app
          codesign --verify --verbose AQtion.app

      - name: Diagnostic — confirm exec bits + bundle layout before upload
        run: |
          echo "=== Bundle tree ==="
          ls -laR AQtion.app | head -60
          echo
          echo "=== Launcher exec bit ==="
          ls -la AQtion.app/Contents/MacOS/AQtion-launcher
          file AQtion.app/Contents/MacOS/AQtion-launcher

      - uses: actions/upload-artifact@v6
        with:
          name: AQtion-darwin-x86_64
          path: AQtion.app

  # Linux turnkey build for Steam. Runs inside the official Steam Linux
  # Runtime "Sniper" SDK container — the binary links against exactly the
  # libs Steam ships with every Steam install (sniper provides SDL2,
  # OpenAL, libpng, libjpeg, libcurl, zlib, ffmpeg, x11, wayland, mesa,
  # etc.). The user never installs anything via apt/dnf/etc.
  #
  # To use this artifact: upload as a Steam depot, then in app_build.vdf
  # set "linux_runtime" "sniper" so Steam launches the game inside the
  # Sniper container automatically.
  linux-steam-sniper:
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: ${{ hashFiles('subprojects/*.wrap') }}

      - name: Build against Steam Runtime Sniper
        run: |
          # Sniper provides SDL2, OpenAL, libpng, libjpeg, libcurl, zlib,
          # ffmpeg, x11, wayland, mesa — but NOT jansson. Force the meson
          # subproject fallback (subprojects/jansson.wrap) so it builds
          # from source. uuid is added preemptively to mirror the fedora
          # job's behavior in case the Sniper SDK doesn't ship libuuid-dev.
          meson setup --force-fallback-for=jansson,uuid \
            ${{ env.MESON_ARGS }} ${{ env.MESON_ARGS_LINUX }} builddir
          meson compile -C builddir

      - name: patchelf Discord SDK path
        run: |
          patchelf --replace-needed \
            /home/runner/work/q2pro/q2pro/extern/discord/lib/x86_64/discord_game_sdk.so \
            ./discord_game_sdk.so \
            builddir/q2pro || true

      - name: Set binaries as executable
        run: |
          chmod +x builddir/q2pro*

      - name: Verify binary only links Sniper-provided libs
        run: |
          echo "=== q2pro linkage ==="
          ldd builddir/q2pro
          echo "OK — verify above that all libs resolve inside the Sniper runtime"

      - uses: actions/upload-artifact@v6
        with:
          name: q2pro-linux-x86_64-steam-sniper
          path: |
            builddir/q2pro
            builddir/q2proded
            builddir/gamex86_64.so
